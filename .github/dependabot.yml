# Dependabot configuration for naapurustot.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Coverage:
#   - npm: frontend (root) + server/api
#   - pip: data pipeline (requirements.txt at repo root)
#   - docker: server/api Dockerfile + server/docker-compose.yml
#   - github-actions: workflows in .github/workflows/
#
# Load-bearing dependency policy (see CLAUDE.md "Known pitfalls"):
#   @turf/union must stay in package.json and its API must keep working
#   for the all-cities metro-area dissolve. Block major bumps so that
#   patch/minor security updates flow through automatically while
#   breaking-change majors stay manual.

version: 2
updates:
  # Frontend (root) npm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      turf:
        patterns:
          - "@turf/*"
      sentry:
        patterns:
          - "@sentry/*"
      types:
        patterns:
          - "@types/*"
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@playwright/test"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "typescript-eslint"
    ignore:
      # Load-bearing — block major bumps (see CLAUDE.md pitfalls)
      - dependency-name: "@turf/union"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@turf/area"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@turf/bbox"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@turf/boolean-intersects"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@turf/boolean-point-in-polygon"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@turf/helpers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Backend API npm dependencies
  - package-ecosystem: npm
    directory: "/server/api"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps-api)"
      include: scope
    groups:
      sentry:
        patterns:
          - "@sentry/*"
      types:
        patterns:
          - "@types/*"
    ignore:
      # Load-bearing on the API — block major bumps
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pg"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Python data pipeline dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - data-pipeline
    commit-message:
      prefix: "chore(deps-py)"
      include: scope
    groups:
      geospatial:
        patterns:
          - "geopandas"
          - "shapely"
          - "fiona"
          - "pyproj"
    ignore:
      # Geospatial stack is tightly coupled — block major bumps so the
      # whole group can be updated together via manual review.
      - dependency-name: "geopandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "shapely"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fiona"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyproj"
        update-types: ["version-update:semver-major"]

  # Docker base image for the API container
  - package-ecosystem: docker
    directory: "/server/api"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps-docker)"
      include: scope
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Docker images used by docker-compose
  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps-docker)"
      include: scope
    ignore:
      # Postgres major bumps require data migration — keep manual
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "caddy"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Europe/Helsinki"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps-actions)"
      include: scope
    groups:
      actions:
        patterns:
          - "actions/*"
      github-actions:
        patterns:
          - "github/*"
