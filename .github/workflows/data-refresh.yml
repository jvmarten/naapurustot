name: Data Refresh

on:
  schedule:
    # Run at midnight UTC on the 1st of every quarter (Jan, Apr, Jul, Oct)
    - cron: '0 0 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: write
  # IN-5: actions:write is required to dispatch auto-merge.yml via `gh workflow run`.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # IN-5: a cold run re-fetches ~483 Overpass queries plus Paavo/StatFin/grid
    # sources and rebuilds the 39 MB GeoJSON, well beyond the 6 h default. Cap it
    # generously so a hung upstream fails the run instead of burning the budget.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # IN-5: Node toolchain to regenerate the app data artifacts (src/data) from the
      # refreshed GeoJSON. topojson-server is now a pinned devDep, so geo2topo output
      # is reproducible across runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run data pipeline
        run: python scripts/prepare_data.py

      # IN-1/IN-8: refresh the kaavat & hankkeet raw inputs (national Väylä
      # projects + participating-city vireillä asemakaava). Each fetcher is
      # resilient to a single source failing (per-source try/except) and exits
      # non-zero only on a total collapse — which SHOULD fail the refresh.
      - name: Refresh planning data (Väylä projects + city zoning)
        run: |
          python scripts/fetch_vayla_projects.py
          python scripts/fetch_city_zoning.py

      - name: Validate output (basic)
        run: |
          GEOJSON="public/data/metro_neighborhoods.geojson"

          if [ ! -f "$GEOJSON" ]; then
            echo "::error::GeoJSON output file not found: $GEOJSON"
            exit 1
          fi

          SIZE=$(stat --format=%s "$GEOJSON")
          echo "GeoJSON file size: $SIZE bytes"

          # IN-5: lower sanity bound. The all-Finland file is ~39 MB; anything under
          # ~5 MB means a truncated/partial pipeline run.
          if [ "$SIZE" -lt 5242880 ]; then
            echo "::error::GeoJSON file too small ($SIZE bytes) — likely corrupted or truncated"
            exit 1
          fi

          # IN-5: upper guard raised to 60 MB. The committed nationwide GeoJSON is
          # ~39 MB, so the old 10 MB limit failed EVERY scheduled run since the
          # all-Finland expansion (the "~1.1 MB" assumption was badly stale).
          if [ "$SIZE" -gt 62914560 ]; then
            echo "::error::GeoJSON file too large ($SIZE bytes) — exceeds 60 MB limit"
            exit 1
          fi

          # Verify valid JSON with at least one feature
          FEATURE_COUNT=$(python3 -c "
          import json, sys
          with open('$GEOJSON') as f:
              data = json.load(f)
          features = data.get('features', [])
          print(len(features))
          if len(features) == 0:
              sys.exit(1)
          ")
          echo "GeoJSON contains $FEATURE_COUNT features"

      - name: Validate data quality
        run: python scripts/validate_data.py

      # IN-5: regenerate the artifacts the app actually loads (per-region TopoJSON,
      # region_properties, ranges, grids, adjacency, slug aliases, build_metadata)
      # from the refreshed GeoJSON. Previously only the GeoJSON was committed, so even
      # a merged refresh changed nothing the app served.
      - name: Rebuild app data artifacts
        run: npm run build:data

      # IN-8: presence guard (fail if a city that had plans now returns nothing,
      # or the national Väylä feed collapsed) + append a freshness entry to the
      # Atom feed. The committed planning_baseline.json is the regression baseline.
      - name: Validate planning data (presence + freshness)
        run: node scripts/validate_planning.mjs

      - name: Provenance manifest summary
        if: always()
        run: |
          MANIFEST="src/data/build_metadata.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::warning::Provenance manifest not found ($MANIFEST) — skipping summary"
            echo "Provenance manifest \`$MANIFEST\` not found — skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$MANIFEST" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              meta = json.load(f)
          metrics = meta.get("metrics", {})
          print("## Data provenance manifest")
          print()
          print(f"- Generated: `{meta.get('generated', 'unknown')}`")
          print(f"- Rows total: **{meta.get('rows_total', '?')}**")
          print(f"- Layers: **{len(metrics)}**")
          print()
          print("| Metric | Source | Vintage | Granularity | Rows | Coverage % |")
          print("| --- | --- | --- | ---: | ---: | ---: |")
          for name in sorted(metrics):
              m = metrics[name]
              proxy = " (proxy)" if m.get("is_proxy") else ""
              print(
                  f"| `{name}`{proxy} | {m.get('source', '?')} | {m.get('vintage', '?')} "
                  f"| {m.get('granularity', '?')} | {m.get('row_count', '?')} "
                  f"| {m.get('coverage_pct', '?')} |"
              )
          PY

      - name: Upload provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: |
            src/data/build_metadata.json
            public/data/build_metadata.json
          if-no-files-found: warn

      # IN-5: detect changes in the GeoJSON OR the regenerated src/data artifacts —
      # a refresh that only re-encodes downstream artifacts still needs to ship.
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet public/data/metro_neighborhoods.geojson src/data public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # IN-5: push to a claude/* branch and dispatch auto-merge, instead of opening a
      # GITHUB_TOKEN PR (which triggers ZERO CI — the recursion guard suppresses
      # workflows on GITHUB_TOKEN pushes). The branch carries the GeoJSON AND the
      # regenerated artifacts; auto-merge.yml runs the full gate then merges to main.
      # Note: the same recursion guard means the push itself won't trigger auto-merge,
      # so we invoke it explicitly via workflow_dispatch (--ref the new branch).
      - name: Push refresh branch and dispatch auto-merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="claude/data-refresh-$DATE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add public/data/metro_neighborhoods.geojson src/data public/data
          git commit -m "chore(data): quarterly refresh ($DATE)"
          git push origin "$BRANCH"

          # Hand off to the standard gate+merge pipeline.
          gh workflow run auto-merge.yml --ref "$BRANCH"
          echo "Dispatched auto-merge for $BRANCH"
