name: Auto-merge to main

on:
  push:
    branches:
      - 'claude/**'
  # IN-5: allow the data-refresh workflow to hand a claude/data-refresh-* branch off
  # to this pipeline via `gh workflow run auto-merge.yml --ref <branch>` — a
  # GITHUB_TOKEN push can't trigger the push event above (recursion guard). The jobs
  # resolve the branch from github.ref_name/github.sha, identical to the push path.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-merge-to-main
  cancel-in-progress: true

# The gate is split into independent jobs that run in parallel, so the wall-clock
# time is the slowest lane rather than the sum of every step. merge-to-main depends
# on ALL of them, so a failure in any lane still blocks the merge to main.
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: npm audit (frontend)
        run: npm audit --audit-level=high

      - name: npm audit (server/api)
        working-directory: server/api
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: pip-audit (data pipeline)
        run: pip-audit --requirement requirements.txt

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Data registry + provenance cross-check (QW-4)
        # Fast files-only validation: registry↔provenance vintage match + proxy
        # flags, reading only JSON (no 39 MB GeoJSON load, no pip deps).
        run: python scripts/validate_data.py --files-only

      - name: build:data idempotency gate (IN-5)
        # Mechanically enforce the CLAUDE.md "never skip build:data" rule. Re-running
        # build:data against the committed GeoJSON must reproduce the committed
        # src/data + public/data artifacts byte-for-byte. build_region_data.mjs derives
        # build_metadata's `generated` timestamp from a content hash of the GeoJSON
        # (not Date.now()) and geo2topo runs from the pinned topojson-server devDep, so
        # an unchanged dataset yields an empty diff. A non-empty diff means the GeoJSON
        # (or another build input) was edited without committing the regenerated
        # artifacts the app actually loads.
        run: |
          npm run build:data
          if ! git diff --quiet -- src/data public/data; then
            echo "::error::build:data output differs from committed artifacts — run 'npm run build:data' and commit the result."
            git diff --stat -- src/data public/data
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Coverage ratchet (IN-5)
        # Mirrors ci.yml so claude/* branches are gated on the coverage ratchet
        # before auto-merge. Fails if coverage drops below coverage-baseline.json.
        run: npm run coverage:check

      - name: Build
        run: npm run build

      # Restore the previous main baseline (saved by merge-to-main below) so the
      # branch's exact gzip delta vs main shows in the step summary. The cache
      # archives the file as bundle-size.json; rename before the script rewrites it.
      - name: Restore base branch bundle size
        uses: actions/cache/restore@v5
        with:
          path: bundle-size.json
          key: bundle-size-main-dummy
          restore-keys: bundle-size-main-

      - name: Stash restored baseline
        run: |
          if [ -f bundle-size.json ]; then mv bundle-size.json base-bundle-size.json; fi

      - name: Check bundle size + report delta
        # Single source of truth shared with ci.yml: scripts/check-bundle-size.mjs
        # holds the 280000 B budget. Without this, GITHUB_TOKEN pushes to main
        # silently bypass ci.yml (GitHub suppresses triggers from GITHUB_TOKEN pushes).
        run: npm run bundle:check

      - name: Region geodata payload report
        # Ported from ci.yml — per-region TopoJSON download size (gzipped), the real
        # on-the-wire map-hot-path cost, separate from the JS bundle budget.
        env:
          REGION_PAYLOAD_CAP_KB: ${{ vars.REGION_PAYLOAD_CAP_KB }}
        run: |
          CAP=${REGION_PAYLOAD_CAP_KB:-1800}
          {
            echo "### 🗺️ Region geodata payload (gzipped)"
            echo "| Region | gzip KB |"
            echo "|--------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.topojson.gz; do
            [ -e "$f" ] || continue
            name=$(basename "$f" | sed -E 's/-[A-Za-z0-9_-]+\.topojson\.gz$//')
            kb=$(( ($(stat -c%s "$f") + 512) / 1024 ))
            printf '%s\t%s\n' "$kb" "$name"
          done | sort -rn | while IFS=$'\t' read -r kb name; do
            flag=""; [ "$kb" -gt "$CAP" ] && flag=" ⚠️"
            echo "| ${name} | ${kb} KB${flag} |" >> "$GITHUB_STEP_SUMMARY"
            # Use if/fi (not `&&`): a trailing `[ -n "$flag" ] && echo` returns 1 on the
            # last (smallest, under-cap) region, which under `set -eo pipefail` fails the
            # whole step. This is an informational report and must never fail the build.
            if [ -n "$flag" ]; then echo "::warning::Region geodata '${name}' is ${kb} KB gzipped (> ${CAP} KB cap)"; fi
          done

      # Forward this branch's bundle size to merge-to-main so it can become the
      # next main baseline — but only saved there, after the merge actually lands.
      - name: Upload bundle size
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size
          path: bundle-size.json
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        # Keyed on the lockfile so the cache invalidates whenever the Playwright
        # version changes. On a hit the browser download is skipped; --with-deps
        # still runs the (fast, idempotent) apt system-dependency install.
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        timeout-minutes: 5

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Prerender profile pages
        run: npm run build:pages

      - name: Lighthouse CI (IN-3)
        # Mirrors ci.yml's lighthouse job so claude/* branches are gated on the
        # same performance/a11y/SEO thresholds before auto-merge.
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.cjs
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lhci-reports/
          retention-days: 14

  server:
    # IN-2: build + test server/api (tsc via `npm run build` + node:test). The server
    # suite and type-check currently run in NO workflow, so auth/sync/GDPR type errors
    # and test failures only surface during the docker build on the droplet AFTER merge.
    # This gates them before the merge to main.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/api/package-lock.json

      - name: Install
        working-directory: server/api
        run: npm ci

      - name: Type check + build
        working-directory: server/api
        run: npm run build

      - name: Test
        working-directory: server/api
        run: npm test

  merge-to-main:
    needs: [security, checks, e2e, lighthouse, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          backoff=2
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            if git merge --no-ff ${{ github.sha }} -m "Auto-merge ${GITHUB_REF_NAME} into main"; then
              if git push origin main; then
                echo "Merge and push succeeded on attempt $attempt"
                exit 0
              else
                echo "Push failed on attempt $attempt (main moved), retrying in ${backoff}s..."
                sleep $backoff
                backoff=$((backoff * 2))
              fi
            else
              echo "Merge conflict on attempt $attempt"
              git merge --abort || true
              exit 1
            fi
          done

          echo "Failed after 5 attempts"
          exit 1

      - name: Delete merged branch
        if: success()
        run: git push origin --delete "${{ github.ref_name }}" || true

      # Save this merged branch's bundle size as the new main baseline so the next
      # claude/* branch's checks job can show its delta vs main. The ci.yml save on
      # main is unreachable (GITHUB_TOKEN pushes don't trigger ci.yml), so this is
      # the only path that ever populates the baseline cache.
      - name: Download bundle size
        if: success()
        uses: actions/download-artifact@v7
        with:
          name: bundle-size

      - name: Save bundle baseline for main
        if: success()
        uses: actions/cache/save@v5
        with:
          path: bundle-size.json
          key: bundle-size-main-${{ github.sha }}

      # Dispatches are best-effort and run after the merge has already landed: a
      # transient GitHub API 500 (or a deploy workflow's own failure) must NOT fail the
      # post-merge job — the next merge re-triggers them. So `if: always()` + `|| echo`.
      - name: Trigger deploy workflow
        if: success()
        run: gh workflow run deploy.yml --ref main || echo "deploy dispatch failed (transient) — non-fatal; next merge re-triggers"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # IN-2: deploy-server.yml's push trigger can never fire (GITHUB_TOKEN pushes are
      # suppressed), so dispatch it explicitly when the merged diff touched server/**.
      - name: Trigger server deploy if server changed
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^server/'; then
            echo "server/** changed — dispatching deploy-server.yml"
            gh workflow run deploy-server.yml --ref main || echo "server deploy dispatch failed (transient) — non-fatal"
          else
            echo "no server/** changes — skipping server deploy"
          fi

      # IN-2: scan the merged code same-day instead of waiting for the Monday cron
      # (the push-to-main trigger never fires for GITHUB_TOKEN pushes).
      - name: Trigger CodeQL scan
        if: success()
        run: gh workflow run codeql.yml --ref main || echo "codeql dispatch failed (transient) — non-fatal"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
