name: Auto-merge to main

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-merge-to-main
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: npm audit (frontend)
        run: npm audit --audit-level=high

      - name: npm audit (server/api)
        working-directory: server/api
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: pip-audit (data pipeline)
        run: pip-audit --requirement requirements.txt

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Coverage ratchet (IN-5)
        # Mirrors ci.yml so claude/* branches are gated on the coverage ratchet
        # before auto-merge. Fails if coverage drops below coverage-baseline.json.
        run: npm run coverage:check

      - name: Build
        run: npm run build

      - name: Check bundle size
        # Mirrors ci.yml so bundle bloat is caught on claude/* branches before
        # auto-merge. Without this, GITHUB_TOKEN pushes to main silently bypass
        # ci.yml (GitHub suppresses workflow triggers from GITHUB_TOKEN pushes).
        run: |
          JS_SIZE=$(find dist/assets -name '*.js' ! -name 'maplibre-*' -exec gzip -c {} \; | wc -c)
          echo "App JS bundle excluding maplibre (gzipped): $JS_SIZE bytes"
          # 280000 B budget — mirrors ci.yml. Raised from 256000 B for the third roadmap
          # batch (36-item FEATURE_ROADMAP) + the UX-review batch. Measured 278914 B; ~1KB margin.
          if [ "$JS_SIZE" -gt 280000 ]; then
            echo "::error::JS bundle size exceeds 280KB gzipped budget ($JS_SIZE bytes)"
            exit 1
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        timeout-minutes: 5

      - name: Prerender profile pages
        run: npm run build:pages

      - name: Lighthouse CI (IN-3)
        # Mirrors ci.yml's lighthouse job so claude/* branches are gated on the
        # same performance/a11y/SEO thresholds before auto-merge.
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.cjs
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lhci-reports/
          retention-days: 14

  merge-to-main:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          backoff=2
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            if git merge --no-ff ${{ github.sha }} -m "Auto-merge ${GITHUB_REF_NAME} into main"; then
              if git push origin main; then
                echo "Merge and push succeeded on attempt $attempt"
                exit 0
              else
                echo "Push failed on attempt $attempt (main moved), retrying in ${backoff}s..."
                sleep $backoff
                backoff=$((backoff * 2))
              fi
            else
              echo "Merge conflict on attempt $attempt"
              git merge --abort || true
              exit 1
            fi
          done

          echo "Failed after 5 attempts"
          exit 1

      - name: Delete merged branch
        if: success()
        run: git push origin --delete "${{ github.ref_name }}" || true

      - name: Trigger deploy workflow
        if: success()
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

