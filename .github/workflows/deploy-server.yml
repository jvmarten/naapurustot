name: Deploy Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SENTRY_DSN,SENTRY_RELEASE
          script: |
            # Stop on the first real failure (e.g. a failed image build) instead of
            # silently carrying on. The one command allowed to fail (seed-umami) is
            # explicitly guarded with `|| echo` below.
            set -e
            cd /opt/naapurustot
            git pull origin main
            cd server
            export SENTRY_DSN SENTRY_RELEASE
            docker compose build api
            docker compose up -d
            # backup.sh is a bind mount (docker-compose.yml: ./backup.sh:/backup.sh:ro),
            # so editing it changes no service config and `up -d` will NOT recreate
            # db-backup — the running container stays inside its `while true; sleep
            # 86400` loop on the old script indefinitely. Worse, `sh` reads a script
            # by byte offset, so replacing the file under a live shell can mis-parse
            # mid-loop. Force the recreate so a change to the backup logic actually
            # takes effect.
            docker compose up -d --force-recreate db-backup
            # Ensure the Umami website entry exists. Idempotent — uses
            # ON CONFLICT DO NOTHING, so it's a no-op when already seeded
            # but restores it after any DB reset.
            docker compose cp seed-umami.sh db:/seed-umami.sh
            docker compose exec -T db bash /seed-umami.sh || echo "seed-umami: skipped (umami not ready yet)"
            echo "Deploy complete"
            docker compose ps
            # Post-deploy health gate (issue #45). appleboy/ssh-action reports the deploy
            # as "success" based only on the script's final exit code, so an api that
            # crash-loops at startup used to deploy green and stay down for days. Probe
            # /health from the caddy container — same docker network, so it works even
            # while api is restarting (it just connection-refuses) and bypasses TLS/DNS —
            # and fail the deploy, dumping api logs, if it never serves 200 within ~60s.
            echo "Verifying api health..."
            healthy=
            for attempt in $(seq 1 30); do
              if docker compose exec -T caddy wget -q -O /dev/null "http://api:3001/health"; then
                healthy=1
                echo "api healthy after ${attempt} attempt(s)"
                break
              fi
              sleep 2
            done
            if [ -z "$healthy" ]; then
              echo "::error:: api did not serve 200 from /health within ~60s — deploy failed"
              docker compose ps
              docker compose logs --tail=100 api
              exit 1
            fi

  # Nothing anywhere watched these workflows. There is no PR to annotate and no
  # webhook, and the only two `if: failure()` steps in the whole tree were an
  # artifact upload and issue-to-pr. A deploy-only failure -- the card rasterizer
  # OOMing, an expired SENTRY_AUTH_TOKEN, an upload timeout -- therefore stopped
  # every merged fix from reaching visitors while CI stayed green on every
  # branch, and the earliest automated detector was health-check's 200-DAY
  # data-age threshold. Open an issue instead.
  notify-failure:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > body.md <<EOF
          deploy-server.yml failed on ${{ github.ref_name }}.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The API droplet may be running old code, or the post-deploy health gate never saw a 200. Accounts and sync are affected.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY"             --title "Server deploy failed (run ${{ github.run_id }})"             --body-file body.md             || echo "::warning::could not open an issue for this failed run"
