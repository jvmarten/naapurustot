name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    # Skip on PRs from claude/* branches — auto-merge.yml runs the same audits
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: npm audit (frontend)
        # Wrapper around `npm audit --json` (scripts/check-audit.mjs): same high/critical
        # gate, plus a small allowlist of reviewed, expiring exemptions for advisories
        # whose only fix is a major bump CLAUDE.md warns against taking.
        run: node scripts/check-audit.mjs

      - name: npm audit (server/api)
        run: node scripts/check-audit.mjs server/api

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: pip-audit (data pipeline)
        run: pip-audit --requirement requirements.txt

  ci:
    # Skip CI on PRs from claude/* branches — auto-merge.yml already runs the full suite
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Data registry + provenance cross-check (QW-4)
        # Fast files-only validation: registry↔provenance vintage match + proxy
        # flags, reading only JSON (no 39 MB GeoJSON load, no pip deps).
        run: python scripts/validate_data.py --files-only

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Coverage ratchet (IN-5)
        # Fails if any headline coverage metric drops below coverage-baseline.json
        # (minus a 0.5pp tolerance). Raise the baseline to lock in gains.
        run: npm run coverage:check

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test --project=e2e
        timeout-minutes: 5

      - name: Visual regression tests
        id: visual-tests
        run: |
          SNAP_DIR="e2e/visual/visual-regression.spec.ts-snapshots"
          if [ -d "$SNAP_DIR" ] && ls "$SNAP_DIR"/*-visual-linux.png >/dev/null 2>&1; then
            echo "Baselines exist — running comparison"
            npm run test:visual
          else
            echo "No baselines — generating snapshots"
            npm run test:visual -- --update-snapshots || true
            npm run test:visual
          fi

      - name: Upload visual diff artifacts
        if: failure() && steps.visual-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-diffs
          path: |
            test-results/
            e2e/visual/visual-regression.spec.ts-snapshots/*-diff.png
            e2e/visual/visual-regression.spec.ts-snapshots/*-actual.png
          retention-days: 14

      # Restore the main-branch bundle baseline (saved by auto-merge after each
      # merge, and by this workflow on direct main pushes) so the script can
      # print this branch's exact gzip delta vs main. The cache archives the file
      # as bundle-size.json; rename it before the build writes a fresh one.
      - name: Restore base branch bundle size
        uses: actions/cache/restore@v5
        with:
          path: bundle-size.json
          key: bundle-size-main-dummy
          restore-keys: bundle-size-main-

      - name: Stash restored baseline
        run: |
          if [ -f bundle-size.json ]; then mv bundle-size.json base-bundle-size.json; fi

      - name: Check bundle size + report delta (IN-1)
        # Single source of truth: scripts/check-bundle-size.mjs holds the 280000 B
        # budget and the measurement logic, shared with auto-merge.yml. Writes
        # bundle-size.json and appends a per-chunk table + delta to the step summary.
        run: npm run bundle:check

      - name: Region geodata payload report (IN-6)
        env:
          REGION_PAYLOAD_CAP_KB: ${{ vars.REGION_PAYLOAD_CAP_KB }}
        run: |
          # Per-region TopoJSON download size (gzipped) — the real on-the-wire cost on
          # the map hot path, separate from (and unbudgeted by) the JS bundle check.
          # Reports every region and warns (does not fail) on any over the cap.
          CAP=${REGION_PAYLOAD_CAP_KB:-1800}
          {
            echo "### 🗺️ Region geodata payload (gzipped)"
            echo "| Region | gzip KB |"
            echo "|--------|---------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in dist/assets/*.topojson.gz; do
            [ -e "$f" ] || continue
            name=$(basename "$f" | sed -E 's/-[A-Za-z0-9_-]+\.topojson\.gz$//')
            kb=$(( ($(stat -c%s "$f") + 512) / 1024 ))
            printf '%s\t%s\n' "$kb" "$name"
          done | sort -rn | while IFS=$'\t' read -r kb name; do
            flag=""; [ "$kb" -gt "$CAP" ] && flag=" ⚠️"
            echo "| ${name} | ${kb} KB${flag} |" >> "$GITHUB_STEP_SUMMARY"
            # Use if/fi (not `&&`): a trailing `[ -n "$flag" ] && echo` returns 1 on the
            # last (smallest, under-cap) region, which under `set -eo pipefail` fails the
            # whole step. This is an informational report and must never fail the build.
            if [ -n "$flag" ]; then echo "::warning::Region geodata '${name}' is ${kb} KB gzipped (> ${CAP} KB cap)"; fi
          done

      - name: Comment bundle size delta on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const current = JSON.parse(fs.readFileSync('bundle-size.json', 'utf8'));
            const fmtKB = (b) => (b / 1024).toFixed(2);

            let body = '## 📦 Bundle Size Report\n\n';
            let hasBase = false;
            try {
              if (fs.existsSync('base-bundle-size.json')) {
                const base = JSON.parse(fs.readFileSync('base-bundle-size.json', 'utf8'));
                hasBase = true;
                const delta = (cur, prev) => {
                  const diff = cur - prev;
                  const sign = diff > 0 ? '+' : '';
                  const pct = prev > 0 ? ` (${sign}${((diff / prev) * 100).toFixed(1)}%)` : '';
                  return `${sign}${(diff / 1024).toFixed(2)} KB${pct}`;
                };
                body += '| Asset | This PR | main | Delta |\n';
                body += '|-------|---------|------|-------|\n';
                body += `| JS (excl. maplibre) | ${fmtKB(current.js)} KB | ${fmtKB(base.js)} KB | ${delta(current.js, base.js)} |\n`;
                body += `| CSS | ${fmtKB(current.css)} KB | ${fmtKB(base.css)} KB | ${delta(current.css, base.css)} |\n`;
                body += `| **Total** | **${fmtKB(current.total)} KB** | **${fmtKB(base.total)} KB** | **${delta(current.total, base.total)}** |\n`;
              }
            } catch (e) {
              // no base data available
            }

            if (!hasBase) {
              body += '| Asset | Gzipped |\n';
              body += '|-------|---------|\n';
              body += `| JS (excl. maplibre) | ${fmtKB(current.js)} KB |\n`;
              body += `| CSS | ${fmtKB(current.css)} KB |\n`;
              body += `| **Total** | **${fmtKB(current.total)} KB** |\n`;
              body += '\n> _No baseline from main yet — delta will appear on future PRs._\n';
            }

            // Upsert: find existing comment by bot, update or create
            const marker = '<!-- bundle-size-report -->';
            body = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Cache bundle size on main
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: bundle-size.json
          key: bundle-size-main-${{ github.sha }}

  lighthouse:
    # IN-3: Lighthouse CI — assert performance/accessibility/best-practices/SEO thresholds.
    # Skip on PRs from claude/* branches — auto-merge.yml runs an equivalent step.
    if: github.event_name == 'push' || !startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Prerender profile pages
        run: npm run build:pages

      # IN-3: guard the prerendered page mesh against the GitHub Pages 1 GB cap. This job
      # has the full build:pages tree (the checks job runs only `npm run build`), so it is
      # where dist size is observable pre-merge.
      - name: Guard dist size (IN-3)
        run: npm run dist:check

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun --config=./lighthouserc.cjs
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: lhci-reports/
          retention-days: 14
