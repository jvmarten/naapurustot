name: Deploy site

# Builds the site and publishes it to the droplet, where Caddy serves
# /srv/naapurustot/current as naapurustot.fi (server/caddy/Caddyfile). The droplet is
# the only host: the GitHub Pages standby was dropped on 2026-10-28, because sharing its
# queue let a stuck Pages environment hold the live site back (one wedge stopped every
# deploy for 1 h 44 m), and the site's ~59,000 files were outgrowing Pages anyway.
# Rollback is a release switch on the droplet (five are kept, see the sync step).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

# Deploys serialize rather than supersede: with several sessions merging through
# auto-merge.yml, cancel-in-progress would let a burst of merges kill each build
# minutes in. GitHub keeps one pending run per group, so a burst collapses to the
# newest, which checks out main and so carries every merge before it.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Measured budget. Warm (og cache hit, the normal case) the build is ~3.5 min and the
    # sync ~2 min. The cold path — a data refresh or card-layout change invalidating every
    # card — is ~7 min of build (~230 s of it rasterizing 9,261 cards on 4 workers) plus a
    # longer sync of the new PNGs. 40 minutes leaves room for both on a slow runner, and
    # stops a hung step long before the default 6-hour ceiling.
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Digitransit subscription key — enables address search (geocode.ts) and
          # travel-time isochrones (isochrone.ts). Baked into the client bundle (static
          # app); free + rate-limited, so rotate in the portal if abused.
          VITE_DIGITRANSIT_API_KEY: ${{ secrets.VITE_DIGITRANSIT_API_KEY }}

      # Restore previously-rasterized card PNGs into dist/og BEFORE build:pages writes
      # the SVGs, so the rasterize step only renders cards that actually changed.
      # `npm run build` (vite, emptyOutDir) has already run, so this is the first thing
      # to touch dist/og. The card SVG names are content-hashed, so a restored PNG is
      # reused only when a current SVG has the identical name (= identical card). Key on
      # the card-content determinants — the committed data version (build_metadata) and
      # the card-emitting/templating/rendering scripts — so a code-only deploy is an
      # exact hit (rasterize skips everything → deploy drops back to ~3 min) and a data
      # refresh or card-layout change triggers a fresh full rasterize.
      #
      # THIS CACHE IS A RATCHET unless two invariants hold, and shipping without them is
      # what broke production in Aug 2026 (2.4 GB / ~65,000 files, Pages sync past the
      # deploy timeout, three straight failed deploys behind a green build job):
      #   1. prerender-hubs.mjs deletes every restored *.svg before emitting this build's
      #      set — otherwise a stale SVG shields its stale PNG from the orphan prune,
      #      which only deletes a PNG when no SVG of that name remains.
      #   2. rasterize-cards.mjs deletes the SVGs once the PNGs exist — the cache is saved
      #      from dist/og itself, so anything left here is carried into the next deploy
      #      AND synced to the server.
      # `check-dist-size.mjs --profile deploy` below is the hard backstop on both.
      - name: Restore rasterized social-card cache
        uses: actions/cache@v4
        with:
          path: dist/og
          # v2 namespace. Every cache under the old `og-cards-` prefix was written before
          # the SVG-drop fix, so each one still carries the SVGs (and, in the older ones,
          # several superseded data-versions of PNGs — up to 32,538 files against ~9,000
          # real cards). The self-healing above means restoring one is merely wasteful
          # rather than harmful, but there is no reason to keep paying to download and
          # re-upload that: orphaning the old namespace lets those entries age out of the
          # repo's 10 GB cache budget, and costs exactly one cold rasterize to do it.
          key: og-cards-v2-${{ hashFiles('src/data/build_metadata.json', 'scripts/social-card.mjs', 'scripts/prerender.mjs', 'scripts/prerender-hubs.mjs', 'scripts/rasterize-cards.mjs') }}
          restore-keys: |
            og-cards-v2-

      - run: npm run build:pages

      # CF-11: rasterize the per-area/per-region social-card SVGs to PNG (FB/LinkedIn/
      # WhatsApp/X don't render SVG og:images). DEPLOY-ONLY — the ~9,000 PNGs add a few
      # hundred MB to dist/ and are pointless for the
      # ci/auto-merge build:pages gates. fonts-dejavu-core gives @resvg an ä/ö/å-capable
      # font for the card text. Most of the cards are served from the cache restored
      # above; only changed cards re-render.
      - name: Install card-rasterizer fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: node scripts/rasterize-cards.mjs

      # IN-3: guard the FULL published tree (mesh + rasterized card PNGs) before upload —
      # fail loudly here rather than let an outsized tree fill the server's disk or stretch
      # the sync. Runs post-rasterize so it measures the real upload, which is now
      # deterministic: the cache carries PNGs only and the SVG set is regenerated every build,
      # so this is a pure function of committed data and can be a HARD gate again.
      - name: Guard published site size (IN-3)
        run: node scripts/check-dist-size.mjs --profile deploy

      - run: cp dist/index.html dist/404.html

      # Each run lands in a fresh release folder. rsync hard-links every file whose
      # checksum matches the current release (--link-dest), so only changed files cross
      # the wire or take disk, and the folder is renamed into place only once complete.
      # The switch is one rename of the `current` symlink, so no request ever sees half a
      # deploy. -c because times are not preserved: the build stamps every file new, and a
      # size+mtime quick check would resend all ~59,000.
      - name: Sync to the droplet and switch `current`
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh_cmd="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20"
          host="root@$DEPLOY_SERVER_IP"
          root=/srv/naapurustot
          # Named by time first, so a plain sort orders releases oldest to newest.
          release="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}"

          # A previous run cut off mid-sync leaves a .partial folder; it is never `current`.
          # The test exits 1 on the very first deploy, which simply means nothing to link against.
          link_dest=()
          if $ssh_cmd "$host" "mkdir -p $root/releases && rm -rf $root/releases/*.partial && test -d $root/current/"; then
            link_dest=(--link-dest="$root/current/")
          fi

          rsync -rlcz --delete "${link_dest[@]}" -e "$ssh_cmd" dist/ "$host:$root/releases/$release.partial/"

          $ssh_cmd "$host" bash -s -- "$root" "$release" <<'REMOTE'
          set -euo pipefail
          root=$1 release=$2
          cd "$root/releases"
          test -s "$release.partial/index.html"
          mv "$release.partial" "$release"
          ln -sfn "releases/$release" "$root/current.tmp"
          mv -Tf "$root/current.tmp" "$root/current"
          # Keep the five newest releases; never the one `current` points at.
          live=$(basename "$(readlink "$root/current")")
          ls -1 | sort | head -n -5 | while read -r old; do
            [ "$old" = "$live" ] || rm -rf -- "$old"
          done
          echo "current -> $(readlink "$root/current")"
          du -sh "$root/releases"
          df -h /
          REMOTE

      # Nothing else watches this workflow: there is no PR, and CI stays green on every
      # branch while a deploy-only failure (the card rasterizer OOMing, an expired
      # SENTRY_AUTH_TOKEN, an unreachable droplet) keeps every merged fix from visitors.
      - name: Open an issue for the failed deploy
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > body.md <<EOF
          deploy.yml could not build or publish the site.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The droplet still serves its previous release, so every merge to main since the
          last successful deploy is not live.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Site deploy failed (run ${{ github.run_id }})" --body-file body.md \
            || echo "::warning::could not open an issue for this failed run"
