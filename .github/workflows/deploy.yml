name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      watchdog_retry:
        description: 'Set only by deploy-watchdog when it replaces a wedged run. Stops a replacement from dispatching another one.'
        type: boolean
        default: false
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys serialize rather than supersede. `cancel-in-progress: true` would clear a
# wedged run automatically, but it would also let a burst of merges starve the site:
# each new dispatch would kill a build already minutes in, and with several Claude
# sessions merging through auto-merge.yml a cold ~7-minute build can easily be
# superseded before it publishes. The wedge is handled by the deploy-watchdog job
# below, which cancels only when the deploy job is provably stuck — so ordering stays
# safe AND the queue still clears itself.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    # Belt-and-suspenders: a hung build (e.g. the card rasterizer regressing again)
    # should fail fast with a clear message instead of the default 6-hour ceiling.
    #
    # Measured budget. Warm (og cache hit, the normal case) the whole job is ~3.5 min. The
    # cold path — a data refresh or card-layout change invalidating every card — is the one
    # that has to fit: ~10 s npm ci + ~30 s build + ~20 s cache restore + ~100 s build:pages
    # + ~7 s fonts + ~230 s rasterize (9,261 cards, 4 workers) + ~30 s upload ≈ 7 min.
    # That leaves ~4x headroom. It used to leave ~1.7x: rasterize-cards.mjs ran its batches
    # through a sequential spawnSync loop, using one core of the runner's four, so a cold
    # rasterize alone took ~14.5 min of an ~18 min job. Even if the fan-out degenerates to
    # one worker (a single-core runner), the cold job still lands ~18 min, inside this cap.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          # Digitransit subscription key — enables address search (geocode.ts) and
          # travel-time isochrones (isochrone.ts). Baked into the client bundle (static
          # app); free + rate-limited, so rotate in the portal if abused.
          VITE_DIGITRANSIT_API_KEY: ${{ secrets.VITE_DIGITRANSIT_API_KEY }}

      # Restore previously-rasterized card PNGs into dist/og BEFORE build:pages writes
      # the SVGs, so the rasterize step only renders cards that actually changed.
      # `npm run build` (vite, emptyOutDir) has already run, so this is the first thing
      # to touch dist/og. The card SVG names are content-hashed, so a restored PNG is
      # reused only when a current SVG has the identical name (= identical card). Key on
      # the card-content determinants — the committed data version (build_metadata) and
      # the card-emitting/templating/rendering scripts — so a code-only deploy is an
      # exact hit (rasterize skips everything → deploy drops back to ~3 min) and a data
      # refresh or card-layout change triggers a fresh full rasterize.
      #
      # THIS CACHE IS A RATCHET unless two invariants hold, and shipping without them is
      # what broke production in Aug 2026 (2.4 GB / ~65,000 files, Pages sync past the
      # deploy timeout, three straight failed deploys behind a green build job):
      #   1. prerender-hubs.mjs deletes every restored *.svg before emitting this build's
      #      set — otherwise a stale SVG shields its stale PNG from the orphan prune,
      #      which only deletes a PNG when no SVG of that name remains.
      #   2. rasterize-cards.mjs deletes the SVGs once the PNGs exist — the cache is saved
      #      from dist/og itself, so anything left here is carried into the next deploy
      #      AND uploaded to Pages.
      # `check-dist-size.mjs --profile deploy` below is the hard backstop on both.
      - name: Restore rasterized social-card cache
        uses: actions/cache@v4
        with:
          path: dist/og
          # v2 namespace. Every cache under the old `og-cards-` prefix was written before
          # the SVG-drop fix, so each one still carries the SVGs (and, in the older ones,
          # several superseded data-versions of PNGs — up to 32,538 files against ~9,000
          # real cards). The self-healing above means restoring one is merely wasteful
          # rather than harmful, but there is no reason to keep paying to download and
          # re-upload that: orphaning the old namespace lets those entries age out of the
          # repo's 10 GB cache budget, and costs exactly one cold rasterize to do it.
          key: og-cards-v2-${{ hashFiles('src/data/build_metadata.json', 'scripts/social-card.mjs', 'scripts/prerender.mjs', 'scripts/prerender-hubs.mjs', 'scripts/rasterize-cards.mjs') }}
          restore-keys: |
            og-cards-v2-

      - run: npm run build:pages

      # CF-11: rasterize the per-area/per-region social-card SVGs to PNG (FB/LinkedIn/
      # WhatsApp/X don't render SVG og:images). DEPLOY-ONLY — the ~9,000 PNGs add a few
      # hundred MB to dist/ (within the 1 GB Pages cap) and are pointless for the
      # ci/auto-merge build:pages gates. fonts-dejavu-core gives @resvg an ä/ö/å-capable
      # font for the card text. Most of the cards are served from the cache restored
      # above; only changed cards re-render.
      - name: Install card-rasterizer fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: node scripts/rasterize-cards.mjs

      # IN-3: guard the FULL published tree (mesh + rasterized card PNGs) before upload —
      # fail loudly here rather than let a slow Pages sync time the deployment out with no
      # explanation. Runs post-rasterize so it measures the real upload, which is now
      # deterministic: the cache carries PNGs only and the SVG set is regenerated every build,
      # so this is a pure function of committed data and can be a HARD gate again.
      - name: Guard published site size (IN-3)
        run: node scripts/check-dist-size.mjs --profile deploy

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The Pages sync is the long pole (tens of thousands of files); cap the job well above
    # the action's own timeout below so the action reports the real reason, not a job kill.
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages defaults to a 10-MINUTE timeout, and that default is what turned a
          # slow deploy into a red one: the published tree had ratcheted up to 2.4 GB /
          # ~65,000 files (see prerender-hubs.mjs + rasterize-cards.mjs for the card-cache
          # ratchet that caused it), the sync crept up to 9m52s on the last green run, and
          # the next three crossed 10:00 and aborted while still `deployment_queued`.
          # The card fixes bring the tree back down, but Pages sync time is not something
          # this repo controls, so give it real headroom — this timeout exists to stop a
          # genuinely stuck deployment, not to police a slow one.
          timeout: 1200000 # 20 min

  # A job carrying an `environment:` does not start until GitHub grants it that
  # environment, and `timeout-minutes` does NOT cover that wait: it measures execution,
  # and a job still waiting on an environment has not begun executing. So the 30-minute
  # cap on `deploy` above cannot bound the failure this job exists for. Nothing inside
  # the workflow can.
  #
  # Measured, run 31307093810 (2026-08-09): `build` succeeded at 10:03:02; the `deploy`
  # job was created at 10:03:02 and then sat at `status: "queued"` with `runner_id: 0`
  # and no steps until a human cancelled it at 11:47:05 — 1 h 44 m under that 30-minute
  # cap. It is not a capacity problem: the sibling `build` job is assigned a runner in
  # 2-3 s on this repo, so a `deploy` job with no runner is waiting on `github-pages`.
  #
  # The cost is a full stop, not a slow deploy. `concurrency: pages` is workflow-level
  # with cancel-in-progress:false, so every later deploy waits for this run to END — the
  # next run (dispatched 10:08:43) did not start its BUILD until 11:47:08 — and GitHub
  # keeps only ONE pending run per group, so a third dispatch silently drops the second.
  # With several sessions merging through auto-merge.yml, that is merges landing on main
  # and never reaching visitors.
  #
  # Cancelling the head run clears it in seconds (cancel 11:47:05 -> next run's build
  # 11:47:08 -> deployed 11:50:50). That cancel is the entire remedy and it was being
  # done by hand; this job does it instead.
  deploy-watchdog:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A watchdog hiccup (API 500, rate limit) must never turn an otherwise healthy
    # deploy red — this job only ever removes a blockage, so failing it is worse noise
    # than skipping it.
    continue-on-error: true
    permissions:
      actions: write
      issues: write
    steps:
      - name: Cancel this run if the deploy job never gets the environment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # How long `deploy` may sit in `queued` before we call it wedged. The healthy
          # transition is ~3 s, so 8 minutes is far outside normal without being
          # trigger-happy on a slow morning.
          STUCK_MINUTES: '8'
          WATCHDOG_RETRY: ${{ inputs.watchdog_retry }}
        run: |
          set -u
          jobs_api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs"
          deadline=$(( $(date +%s) + STUCK_MINUTES * 60 ))
          status=""

          while :; do
            # Exactly one job is named `deploy` (deploy-watchdog does not match), so this
            # yields a single line. An API blip yields an empty one — handled below.
            status=$(gh api "$jobs_api" --jq '.jobs[] | select(.name == "deploy") | .status' || echo "")
            case "$status" in
              in_progress|completed)
                echo "deploy job is '$status' — nothing to unstick"
                exit 0
                ;;
            esac
            [ "$(date +%s)" -ge "$deadline" ] && break
            sleep 20
          done

          # Only act on a state we actually observed. If the last poll failed we do not
          # know the job is stuck, and cancelling a healthy production deploy on the
          # strength of a failed API call would be a far worse bug than the wedge.
          if [ "$status" != "queued" ]; then
            echo "could not confirm a wedge (last observed status: '${status:-unknown}') — leaving this run alone"
            exit 0
          fi

          echo "::warning::deploy job has been queued ${STUCK_MINUTES}m with no runner — treating the github-pages environment as wedged"

          # Queue the replacement BEFORE cancelling: a run dispatched now waits at the
          # `pages` gate and starts the moment this run ends, which is exactly the
          # measured recovery. Dispatching after the cancel would race the cancel.
          #
          # But GitHub keeps exactly ONE pending run per concurrency group, so
          # dispatching while another deploy is already in line would CANCEL that one
          # rather than add to the queue. Only dispatch when nothing is waiting.
          waiting=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?per_page=50" \
            --jq '[.workflow_runs[]
                   | select((.id | tostring) != env.GITHUB_RUN_ID)
                   | select(.status == "queued" or .status == "pending"
                            or .status == "waiting" or .status == "in_progress")]
                  | length' || echo "0")

          if [ "${waiting:-0}" -gt 0 ]; then
            echo "$waiting deploy run(s) already queued behind this one — they start as soon as this run ends"
          elif [ "$WATCHDOG_RETRY" = "true" ]; then
            # A replacement that wedges too means the environment is not recovering, so a
            # third would just burn another cycle. Escalate to a human instead.
            echo "::error::this run was itself a watchdog replacement and wedged again — not dispatching a third"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Pages deploy wedged twice on the github-pages environment" \
              --body "deploy.yml run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} was dispatched by deploy-watchdog to replace an earlier wedged run, and its own \`deploy\` job also sat in \`queued\` for ${STUCK_MINUTES} minutes without a runner.

          The published site is now STALE: every merge to main since the last successful deploy is not live. Two consecutive wedges means the \`github-pages\` environment is not clearing on its own — check https://www.githubstatus.com/ and re-run deploy.yml once Pages is healthy." \
              || echo "::warning::could not open an issue for the repeated wedge"
          else
            echo "nothing queued behind this run — dispatching a replacement before cancelling"
            gh workflow run deploy.yml --ref main -f watchdog_retry=true \
              || echo "::warning::replacement dispatch failed — the next merge to main will deploy instead"
          fi

          # Cancel LAST. This kills the watchdog job too, so nothing after it runs.
          echo "cancelling run $GITHUB_RUN_ID to release the github-pages environment"
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

  # Nothing anywhere watched these workflows. There is no PR to annotate and no
  # webhook, and the only two `if: failure()` steps in the whole tree were an
  # artifact upload and issue-to-pr. A deploy-only failure -- the card rasterizer
  # OOMing, an expired SENTRY_AUTH_TOKEN, an upload timeout -- therefore stopped
  # every merged fix from reaching visitors while CI stayed green on every
  # branch, and the earliest automated detector was health-check's 200-DAY
  # data-age threshold. Open an issue instead.
  notify-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > body.md <<EOF
          deploy.yml failed on ${{ github.ref_name }}.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The published site is now STALE: every merge to main since the last successful deploy is not live.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY"             --title "Pages deploy failed (run ${{ github.run_id }})"             --body-file body.md             || echo "::warning::could not open an issue for this failed run"
