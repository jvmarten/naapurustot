<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0c1d33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="40" x2="0" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13294a"/>
      <stop offset="1" stop-color="#0d1f39"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="40" y="40" width="1120" height="550" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="url(#card)" stroke="#2d5a8e" stroke-width="2"/>

  <!-- Decorative neighbourhood mosaic, full-bleed and faint so text stays legible -->
  <g clip-path="url(#cardClip)">
    <g opacity="0.10" stroke="#4a90d9" stroke-width="1">
      <line x1="190" y1="40" x2="190" y2="590"/>
      <line x1="430" y1="40" x2="430" y2="590"/>
      <line x1="770" y1="40" x2="770" y2="590"/>
      <line x1="1010" y1="40" x2="1010" y2="590"/>
      <line x1="40" y1="190" x2="1160" y2="190"/>
      <line x1="40" y1="430" x2="1160" y2="430"/>
    </g>
    <g opacity="0.16">
      <path d="M120 130 L250 110 L270 200 L170 230 Z" fill="#3b82f6"/>
      <path d="M250 110 L390 90 L410 180 L270 200 Z" fill="#60a5fa"/>
      <path d="M170 230 L270 200 L290 290 L200 310 Z" fill="#2563eb"/>
      <path d="M270 200 L410 180 L430 270 L290 290 Z" fill="#93c5fd"/>
      <path d="M390 90 L530 100 L520 190 L410 180 Z" fill="#1d4ed8"/>
      <path d="M200 310 L290 290 L310 380 L230 400 Z" fill="#60a5fa"/>
      <path d="M820 360 L950 340 L970 430 L870 460 Z" fill="#2563eb"/>
      <path d="M950 340 L1060 360 L1040 450 L970 430 Z" fill="#3b82f6"/>
      <path d="M880 460 L970 430 L990 510 L900 530 Z" fill="#93c5fd"/>
      <path d="M1010 130 L1090 160 L1070 250 L990 220 Z" fill="#60a5fa"/>
    </g>
  </g>

  <!-- Centred wordmark + tagline -->
  <text x="600" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="92" letter-spacing="-2" text-anchor="middle"><tspan fill="#ffffff">naapurustot</tspan><tspan fill="#4a90d9">.fi</tspan></text>

  <text x="600" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="34" fill="#cbd5e1" text-anchor="middle">Vertaile koko Suomen asuinalueita kartalla</text>

  <text x="600" y="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#7c93b3" text-anchor="middle">Lähes 60 mittaria · 3 000+ postinumeroaluetta · 69 seutukuntaa</text>
</svg>
