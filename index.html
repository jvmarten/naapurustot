      <div style="max-width:800px;margin:2rem auto;padding:1rem;font-family:sans-serif">
        <h1>naapurustot.fi — vertaile asuinalueita, kaupunginosia ja lähiöitä kartalla</h1>
        <p>naapurustot.fi on ilmainen interaktiivinen karttapalvelu, jolla voit vertailla ja tutkia Suomen asuinalueita, kaupunginosia, lähiöitä ja postinumeroalueita yli 50 eri mittarilla — tulotasosta ja asuntohinnoista palveluihin, turvallisuuteen, joukkoliikenteeseen ja ympäristöön.</p>
        <h2>Koko Suomen kattava naapurustokartta</h2>
        <p>Palvelu kattaa 3 018 postinumeroaluetta kaikilla 69 seutukunnalla — koko Manner-Suomen ja Ahvenanmaan. Jokaisesta alueesta on oma tilastosivunsa kolmella kielellä (suomi, englanti, ruotsi).</p>
        <h2>Selaa alueita</h2>

          <li><a href="/kaupunki/tampere/">Tampereen seutu</a></li>
          <li><a href="/kaupunki/turku/">Turun seutu</a></li>
          <li><a href="/kaupunki/oulu/">Oulun seutu</a></li>
        </ul>
        <h2>Ominaisuudet</h2>
        <ul>
          <li>Interaktiivinen kartta naapurustojen ja kaupunginosien vertailuun</li>
          <li>Yli 50 eri mittaria ja tilastoa</li>
          <li>Naapurustojen ja kaupunginosien ranking-listat ja suodattimet</li>
          <li>Asuinalueen ja kaupunginosan hakutyökalu</li>
          <li>Naapurustojen vertailu vierekkäin</li>
          <li>Laatuindeksi 0–100 omilla painotuksilla</li>
        </ul>
        <p>Tiedot pohjautuvat avoimeen dataan: Tilastokeskus (Paavo), HSL, HSY, OpenStreetMap ja muut julkiset lähteet. Ota JavaScript käyttöön nähdäksesi interaktiivisen kartan.</p>
