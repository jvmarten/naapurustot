services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Address(es) of the static-site block in caddy/Caddyfile. Never empty: an empty
      # value would leave that site block with no address.
      SITE_HOSTS: ${SITE_HOSTS:-next.naapurustot.fi}
    volumes:
      # The directory, not the file: `git pull` replaces Caddyfile with a new inode,
      # and a single-file bind mount keeps showing the container the old one. A
      # directory mount sees the new file; deploy-server.yml then reloads Caddy.
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
      # The static site: release folders plus the `current` symlink that deploy.yml
      # switches. Mounted at the same path so the symlink resolves inside the container.
      - /srv/naapurustot:/srv/naapurustot:ro

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://naapurustot_api:${API_DB_PASSWORD}@db:5432/naapurustot
      JWT_SECRET: ${JWT_SECRET}
      # Private operator dashboard (admin.ts reads process.env directly — no dotenv, so
      # a value in server/.env never reaches the container otherwise). Unset → the
      # dashboard refuses every request (fail-closed). Without this line it was unset in
      # the container, silently disabling the feature even when set in server/.env.
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET}
      # IN-2: forward the anti-phishing hostname allowlist (turnstile.ts reads it).
      # Without this it was unset in the container, silently disabling the check.
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Password-reset email (Resend). Unset → mailer.ts no-ops and
      # /auth/forgot-password still answers 200, so the API runs fine without it.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@naapurustot.fi}
      # Origin used to build reset links. Must match the deployed frontend or
      # every emailed link 404s.
      APP_BASE_URL: ${APP_BASE_URL:-https://naapurustot.fi}
      # Supporter subscription (Stripe). Unset → billing.ts billingConfigured() is
      # false, so /billing/* and the webhook answer 503 and the rest of the API is
      # unaffected. These MUST be forwarded here: the API reads process.env directly
      # (no dotenv), so a value in server/.env never reaches the container otherwise.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TAX_ENABLED: ${STRIPE_TAX_ENABLED:-}
      NODE_ENV: production
      PORT: "3001"
    depends_on:
      db:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${APP_SECRET}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    external: true
  caddy_data:
  caddy_config:
